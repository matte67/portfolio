[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=4096"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true

[[redirects]]
  from = "/work/*"
  to = "/en/work/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/articles/*"
  to = "/en/articles/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/thesis/*"
  to = "/en/thesis/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/about/*"
  to = "/en/about/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/matteo-avatar.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/documents/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
